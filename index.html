<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122D40">
<title>ilmi — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122D40; --lime:#D4F238; --cream:#F2F1EA; --red:#F06C61; --blue:#8AC6F2; --moss:#2F4A3E;
  --white75:rgba(255,255,255,.75); --ink75:rgba(18,45,64,.75);
  --head:'Space Grotesk',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);background:#0a141c;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:20px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input{font:inherit}

/* demo chrome (desktop only) */
.topbar{display:flex;gap:10px;align-items:center;color:#6f8291;font-size:13px}
.topbar button{border:1px solid #2a4458;border-radius:999px;padding:6px 14px;color:#c9d4dc;font-size:12px}
.topbar button:active{background:var(--lime);color:var(--navy)}
.phone{width:402px;height:874px;max-height:calc(100vh - 80px);border-radius:46px;background:var(--navy);position:relative;overflow:hidden;box-shadow:0 0 0 10px #04080b,0 0 0 11px #24323d,0 30px 80px rgba(0,0,0,.6)}
@media (max-width:460px){
  body{padding:0;gap:0;justify-content:flex-start}
  .topbar{display:none}
  .phone{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:env(safe-area-inset-top)}
.screen::-webkit-scrollbar{display:none}
.screen.noscroll{overflow:hidden}
.screen.has-nav{bottom:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.fade-in{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ---------- universal press feedback (no hover on mobile) ---------- */
.press{transition:transform .12s ease, filter .12s ease, background-color .12s, color .12s}
.press:active{transform:scale(.96);filter:brightness(.88)}

/* header */
.hdr{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 4px;position:sticky;top:0;z-index:5;background:var(--navy)}
.hdr .t{font-size:14px;color:var(--white75);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-transform:lowercase}
.iconbtn{width:50px;height:40px;display:grid;place-items:center;border-radius:12px;transition:background .12s, transform .12s}
.iconbtn:active{background:rgba(212,242,56,.22);transform:scale(.92)}
.info{width:26px;height:26px;border-radius:50%;background:var(--cream);display:grid;place-items:center;overflow:hidden}
.info img{height:16px;width:auto;display:block;margin-left:1px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:46px;border-radius:66px;font-family:var(--body);font-size:16px;transition:transform .1s, background-color .12s, color .12s, box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--navy)}
.btn.lime:active{background:#b9d61f;box-shadow:0 0 0 4px rgba(212,242,56,.3)}
.btn.outline{border:2px solid var(--lime);color:var(--lime)}
.btn.outline:active{background:var(--lime);color:var(--navy)}
.btn.social{position:relative}
.btn.social svg{position:absolute;left:38px}
.cta{display:inline-flex;align-items:center;justify-content:center;height:43px;padding:0 22px;border-radius:66px;font-family:var(--body);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.01em;transition:transform .1s, filter .12s, box-shadow .12s}
.cta:active{transform:scale(.95);filter:brightness(.85);box-shadow:0 0 0 4px rgba(212,242,56,.3)}
.cta.lime{background:var(--lime);color:var(--navy)}
.cta.navy{background:var(--navy);color:var(--cream)}
.cta.navy:active{box-shadow:0 0 0 4px rgba(18,45,64,.25)}
.cta.blue{background:var(--blue);color:var(--navy)}
.cta.blue:active{box-shadow:0 0 0 4px rgba(138,198,242,.4)}
.cta.ghost{border:2px solid var(--navy);color:var(--navy)}
.cta.ghost:active{background:var(--navy);color:var(--cream)}
.ulink{font-family:var(--body);font-weight:600;font-size:14px;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;color:var(--navy);padding:6px 0;border-radius:6px;transition:background .12s}
.ulink:active{background:rgba(18,45,64,.12)}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(69px + env(safe-area-inset-bottom));isolation:isolate;z-index:30;display:flex;align-items:flex-end;gap:5px;padding:0 1px;pointer-events:none}
.nav::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(130px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(18,45,64,0) 0%,rgba(18,45,64,.18) 22%,rgba(18,45,64,.45) 42%,rgba(18,45,64,.72) 62%,rgba(18,45,64,.9) 80%,rgba(18,45,64,.96) 100%);z-index:-1;pointer-events:none}
.nav button{pointer-events:auto;flex:1;height:calc(56px + env(safe-area-inset-bottom));background:none;color:var(--lime);display:flex;flex-direction:column;align-items:center;padding-top:2px;font-size:12px;text-transform:lowercase;position:relative;transition:color .35s ease .12s}
.nav button::before{content:"";position:absolute;inset:0;background:#2F4B3F;border-radius:24px 55px 0 0;z-index:0;transition:border-radius .55s cubic-bezier(.65,0,.35,1), opacity .3s ease}
.nav button.mirror::before{border-radius:55px 24px 0 0}
.nav button.on::before{border-radius:55px 55px 0 0;opacity:0}
.nav button > *{position:relative;z-index:2}
.nav button.on{color:var(--navy)}
.nav button:active > svg{transform:scale(.92)}
.nav button svg{transition:transform .2s ease}
.nav svg{width:40px;height:40px;stroke-width:1.7}
.nav .blob{position:absolute;bottom:0;height:calc(56px + env(safe-area-inset-bottom));background:var(--lime);border-radius:55px 55px 0 0;z-index:1;pointer-events:none}

/* welcome */
.welcome{padding:0 28px;display:flex;flex-direction:column;align-items:center;min-height:100%}
.welcome img.logo{width:274px;margin-top:96px}
.tag{color:var(--lime);font-family:var(--head);font-size:24px;margin-top:34px}
.sub{color:var(--white75);font-size:14px;text-align:center;margin-top:20px;line-height:18px;max-width:270px}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(9,22,32,.6);z-index:40;display:flex;animation:sfade .2s}
@keyframes sfade{from{opacity:0}}
.gsheet{background:#fff;color:#1f1f1f;margin:282px 10px auto;border-radius:18px;width:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;animation:pop .25s ease;align-self:flex-start}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.gsheet .top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #e3e3e3;font-size:13px}
.gsheet .acct{display:flex;gap:16px;align-items:center;padding:20px 17px 14px}
.gsheet .acct img{width:40px;height:40px;border-radius:50%}
.gsheet .go{margin:20px 17px 26px;height:46px;border-radius:23px;background:#1a73e8;color:#fff;font-size:17px;width:calc(100% - 34px);transition:filter .1s, transform .1s}
.gsheet .go:active{filter:brightness(.85);transform:scale(.98)}
.gsheet p{font-size:14px;line-height:1.5;padding:0 17px 20px;color:#222}
.gsheet a{color:#1a73e8;text-decoration:none}

/* how / scanner */
.how{margin:116px 33px 0;height:487px;border-radius:2px;padding:46px 30px 0 50px;background:
  radial-gradient(ellipse 60% 30% at 15% 85%,rgba(91,130,155,.45),transparent 70%),
  radial-gradient(ellipse 50% 25% at 85% 25%,rgba(91,130,155,.35),transparent 70%),
  radial-gradient(ellipse 80% 40% at 60% 55%,rgba(60,95,120,.35),transparent 70%),#1d3b51}
.how h2{font-family:var(--head);font-weight:400;font-size:24px;text-align:center;margin:0 0 66px -20px}
.how .step{display:flex;gap:14px;margin-bottom:57px;font-family:var(--head);font-size:14px;line-height:18px}
.how .step b{font-weight:300;font-size:22px;color:var(--white75);line-height:1;width:12px}
.choose{text-align:center;font-size:14px;color:var(--white75);margin-top:20px}
.toggle{margin:6px auto 0;width:228px;height:55px;border:1.5px solid var(--lime);border-radius:30px;display:flex;align-items:center;padding:4px;position:relative}
.toggle .knob{position:absolute;top:5px;bottom:5px;width:108px;border-radius:24px;background:var(--lime);transition:left .25s cubic-bezier(.3,.7,.3,1)}
.toggle button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:600;height:100%;color:var(--lime);text-decoration:underline;text-underline-offset:3px;border-radius:24px;transition:background .12s}
.toggle button:active{background:rgba(212,242,56,.2)}
.toggle button.on{color:var(--navy);text-decoration:none}
.viewfinder{margin:0 33px;height:487px;position:relative;overflow:hidden;background:#000}
.viewfinder img{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:6%;right:6%;height:2px;background:var(--lime);box-shadow:0 0 14px 3px rgba(212,242,56,.55);animation:scan 1.5s ease-in-out infinite alternate}
@keyframes scan{from{top:14%}to{top:84%}}
.detected{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--lime);color:var(--navy);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;animation:pop .25s}

/* squiggle loader */
.loading{margin:30px 33px 18px;height:44px}
.loading .lbl{font-size:14px;color:var(--white75);text-transform:lowercase;display:block;margin-bottom:6px}
.squig{position:relative;height:16px;width:100%}
.squig .fill{position:absolute;inset:0 auto 0 0;overflow:hidden;width:0;border-radius:0 8px 8px 0}
.squig img{display:block;height:16px;max-width:none}
.loader-screen{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 33px}
.loader-screen .loading{margin:0}
.loader-screen h2{font-family:var(--head);font-weight:400;font-size:32px;line-height:1.3;margin-bottom:40px}

/* message screens */
.center{padding:0 28px;min-height:100%;position:relative}
.center>.hdr{margin:0 -28px}
.big{font-family:var(--head);font-size:32px;line-height:1.3;font-weight:400;margin-top:215px;color:#fff}
.note{font-size:14px;color:var(--white75);margin-top:14px}
.stack{display:flex;flex-direction:column;gap:35px;margin-top:93px}
.bottom{position:absolute;left:28px;right:28px;bottom:40px}
.tiles{display:flex;gap:21px;margin-top:99px;margin-left:-6px;margin-right:-6px}
.tile{flex:1;aspect-ratio:1;border:2px solid var(--lime);border-radius:27px;color:var(--lime);font-size:16px;line-height:20px;text-align:center;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;transition:background .12s,color .12s,box-shadow .12s,transform .12s}
.tile:active,.tile.picked{background:var(--lime);color:var(--navy);box-shadow:0 0 0 5px var(--navy),0 0 0 7px var(--lime)}
.tile.done{pointer-events:none;border-color:rgba(212,242,56,.25);color:rgba(212,242,56,.25)}
.tile .ck{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(242,241,234,.55);display:grid;place-items:center;animation:ckin .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes ckin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}

/* quiz */
.quiz{padding:0 27px;min-height:100%;position:relative;padding-bottom:120px}
.quiz>.hdr{margin:0 -27px}
.qn,.qq{font-family:var(--head);font-size:32px;line-height:1.28;color:#fff;padding-left:11px}
.qn{margin-top:49px}
.qq{margin-top:8px}
.hint{font-size:16px;color:var(--white75);margin:30px 0 -20px;text-align:center}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.opts.loose{gap:30px}
.opt{min-height:46px;border:2px solid var(--lime);border-radius:66px;color:var(--lime);font-size:16px;padding:10px 16px;text-align:center;transition:background .12s,color .12s,transform .1s}
.opt:active{transform:scale(.97);background:rgba(212,242,56,.3)}
.opt.on{background:var(--lime);color:var(--navy)}
.qfoot{position:absolute;left:38px;right:38px;bottom:51px;display:flex;align-items:center;justify-content:space-between}
.qlink{color:var(--lime);font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;border-radius:8px;transition:background .12s}
.qlink:active{background:rgba(212,242,56,.2)}
.qlink.dim{opacity:.5}
.dots{display:flex;gap:11px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;transition:background .2s}
.dots i.on{background:#fff}
.skipwarn{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:12px;color:rgba(255,255,255,.4)}
.field{display:flex;gap:16px;margin-top:45px}
.field input{flex:1;min-width:0;height:50px;border-radius:10px;border:1.5px solid #fff;background:transparent;color:#fff;padding:0 14px;font-size:14px;outline:none}
.field input:focus{border-color:var(--lime)}
.field input::placeholder{color:var(--white75)}
.field button{width:80px;height:50px;border-radius:66px;border:2px solid var(--lime);color:var(--lime);font-size:16px;transition:background .12s,color .12s}
.field button:active{background:var(--lime);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--lime);color:var(--navy);border-radius:16px;padding:5px 6px 5px 12px;font-size:14px;display:flex;gap:4px;align-items:center}
.chip button{font-size:16px;line-height:1;color:var(--navy);width:22px;height:22px;border-radius:50%}
.chip button:active{background:rgba(18,45,64,.2)}
.small-note{font-size:14px;color:var(--white75);margin-top:8px}
.custom-input{display:flex;gap:8px}
.custom-input input{flex:1;min-width:0;height:46px;border-radius:66px;border:2px solid var(--lime);background:transparent;color:#fff;padding:0 18px;outline:none;font-size:16px}

/* product page */
.pp{padding:0 11px}
.pp>.hdr{margin:0 -11px}
.h1{font-family:var(--head);font-size:48px;font-weight:500;letter-spacing:-.01em;margin:2px 4px 12px;color:#fff}
.feedback{background:var(--cream);color:var(--navy);border-radius:20px;height:37px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;font-size:16px;margin:13px 0 0}
.fb-btns{display:flex;gap:16px;align-items:center}
.fb-btns button{height:28px;border-radius:14px;display:grid;place-items:center;transition:transform .1s, background .12s}
.fb-btns button:active{transform:scale(.88)}
.fb-btns .yes{background:var(--navy);width:40px}
.fb-btns .no{width:42px;font-family:var(--head);font-size:26px;line-height:1}
.fb-btns .no:active{background:rgba(18,45,64,.15)}
.feedback.thanks{animation:pop .25s}
.hero{background:var(--lime);color:var(--navy);border-radius:6px;height:152px;display:flex;overflow:hidden;margin-top:27px}
.hero .txt{flex:1;padding:24px 12px 16px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:right}
.hero h3{font-family:var(--head);font-weight:400;font-size:24px;line-height:1.25}
.brand{font-size:16px;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.brand i{width:1px;height:20px;background:var(--navy)}
.hero img{width:152px;height:152px;object-fit:cover}
.tabs{margin:22px 0 0;height:38px;border:1.5px solid var(--lime);border-radius:20px;display:flex;padding:3px;position:relative}
.tabs .knob{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:16px;background:var(--lime);transition:left .25s cubic-bezier(.3,.7,.3,1)}
.tabs button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:600;text-transform:uppercase;color:var(--lime);text-decoration:underline;text-underline-offset:3px;border-radius:16px;transition:background .12s}
.tabs button:active{background:rgba(212,242,56,.2)}
.tabs button.on{color:var(--navy);text-decoration:none}
.sec{margin-top:24px;position:relative}
.pill::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:8px;background:var(--cream)}
.pill{display:block;width:fit-content;background:var(--cream);color:var(--navy);font-size:14px;font-weight:600;padding:2px 10px 0;height:22px;line-height:20px;border-radius:10px 10px 0 0;margin:0 0 -1px 19px;text-transform:uppercase;position:relative;z-index:1}
.card{background:var(--cream);color:var(--navy);border-radius:6px;padding:14px 16px}
.scorecard{display:flex;align-items:center;justify-content:space-between;min-height:93px;padding:12px 18px 12px 19px}
.scorecard .l{font-size:14px;line-height:14px;max-width:210px}
.scorecard .l .ulink{display:inline-block;margin-top:8px;white-space:nowrap}
.score{display:flex;align-items:center;gap:4px}
.sbox{background:var(--navy);color:var(--lime);border-radius:15.7px;font-family:var(--head);font-weight:500;font-size:44px;line-height:57px;height:57px;padding:0 10px;min-width:48px;text-align:center}
.slash{font-family:var(--head);font-weight:500;font-size:37px;line-height:1;display:flex;align-items:center;gap:2px}
.slash i{display:inline-block;width:3px;height:52px;background:var(--navy);transform:rotate(16deg);border-radius:2px;margin:0 6px}
.locked{position:relative;overflow:hidden;overflow:clip;margin:0 -11px;padding:4px 11px 14px}
.locked > .blurred{filter:blur(9px) saturate(.8);opacity:.5;pointer-events:none;user-select:none;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.lockover{position:absolute;left:0;right:0;top:0;z-index:2}
.lockover.sticky{bottom:0}
.lockover .msg{background:rgba(64,92,114,.92);border-radius:10px;margin:22px 11px 0;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(6,18,27,.35);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:14px;color:var(--cream)}
.lockover .msg-wrap{padding:0}
.lockover.sticky .msg-wrap{position:sticky;top:58px}
.flag{margin-bottom:3px;border-radius:6px}
.flag .head{display:flex;justify-content:space-between;align-items:flex-start;width:100%;text-align:left;color:inherit;border-radius:6px;transition:background .12s}
.flag .head:active{background:rgba(18,45,64,.07)}
.badge{display:inline-flex;align-items:center;height:26px;font-size:14px;font-weight:600;padding:0 10px;border-radius:30px;text-transform:uppercase}
.badge.red{background:var(--red);color:var(--navy)}
.badge.blue{background:var(--blue);color:var(--navy)}
.badge.dark{background:var(--navy);color:var(--lime);font-size:12px;height:22px;margin-left:8px}
.flag h4{font-family:var(--head);font-weight:400;font-size:24px;margin:4px 0 2px}
.flag .desc{font-size:16px;line-height:17px;color:var(--navy)}
.flag:not(.open) .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink75)}
.chev{flex:none;transition:transform .22s, opacity .22s;margin-top:4px;opacity:.5}
.open > .head .chev, .orow.open .chev{transform:rotate(180deg);opacity:1}
.acc-opening .chev{animation:chevOpen .42s cubic-bezier(.4,0,.2,1)}
.acc-closing .chev{animation:chevClose .42s cubic-bezier(.4,0,.2,1)}
@keyframes chevOpen{from{transform:rotate(0);opacity:.5}to{transform:rotate(180deg);opacity:1}}
@keyframes chevClose{from{transform:rotate(180deg);opacity:1}to{transform:rotate(0);opacity:.5}}
.acc-opening .concern,.acc-opening .acts,.acc-opening .body p{animation:accIn .38s ease .08s both}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}}
.concern{font-size:14px;color:var(--ink75);margin:18px 0 12px}
.acts{display:flex;justify-content:space-between;gap:10px}
.acts .cta{flex:1 1 auto;padding:0 14px;white-space:nowrap;font-size:13px}
.orow{background:url(assets/divider.png) left bottom/100% 4px no-repeat;padding-bottom:2px}
.orow:last-child{border-bottom:0}
.orow .head{display:flex;gap:12px;align-items:center;padding:8px 0 9px;font-size:16px;width:100%;text-align:left;border-radius:4px;transition:background .12s}
.orow .head:active{background:rgba(18,45,64,.07)}
.orow .head span.n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .body{padding:0 0 14px}
.orow .body p{font-size:14px;line-height:17px}

function ingScore(id=S.pid){
  const pr = PRODUCTS[id], p = S.prefs.ingredient; if(!p) return pr.ing;
  let s = pr.ing + .5; const avoid = p[3]||[];
  pr.flags.forEach(fi=>{ if(avoid.includes(FLAGS[fi].key)) s -= 1; });
  pr.others.forEach(oi=>{ if(OTHERS[oi].key && avoid.includes(OTHERS[oi].key)) s -= .5; });
  if(pr.flags.length){ if(p[1]==='Very sensitive') s -= 1; else if(p[1]==='Sometimes reacts') s -= .5; }
  if((p[5]||[]).includes('Fragrance-free') && pr.flags.includes(0)) s -= .5;
  return Math.max(1, Math.min(10, Math.round(s*2)/2));
}
function coScore(id=S.pid){
  const pr = PRODUCTS[id], p = S.prefs.company; if(!p) return pr.co;
  let s = pr.co; const strict = p[0]==='Only show brands aligned with my values';
  const dem = pr.leanPos>60, rep = pr.leanPos<40;
  if(p[1]==='Republican'){ if(dem) s -= strict?4:1.5; if(rep) s += 1; }
  if(p[1]==='Democrat'){ if(rep) s -= strict?4:1.5; if(dem) s += 1; }
  if(p[2]==='Conservative (Under 5%)' && pr.adTag[0]==='Above average') s -= 1;
  if(p[3]==='Independent / Small Business Only' && pr.parent) s -= 1.5;
  if(p[5]==='Maximum Science (> 7%)' && pr.rsTag[0]!=='Above average') s -= .5;
  return Math.max(1, Math.min(10, Math.round(s*2)/2));
}

  const key = id => S.sort==='ingredient'? ingScore(id) : S.sort==='company'? coScore(id) : ingScore(id)+coScore(id);
  return ids.sort((a,b)=>key(b)-key(a));
}

  const unlocked = anyPrefs(), pr = P();
  const ranked = rankedOthers().slice(0,4);
  const top = ranked.includes(S.topPick) ? S.topPick : ranked[0];
  const rest = ranked.filter(id=>id!==top);
  const mini = n => `<span class="mini"><b>${n}</b><i></i><span>10</span></span>`;
  const big = (id, cls, extra='') => { const q=PRODUCTS[id]; return `<button class="swap ${cls}" ${extra} data-act="${id===S.pid?'swapCurrent':'openProduct'}" data-v="${id}"><div class="txt"><h3>${q.name}</h3><div class="brand">${q.brand} <i></i> ${q.parent}</div>

/* ---------------- render ---------------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function render(transition){
  const keep = !transition ? $screen.scrollTop : 0;
  $screen.innerHTML = V[S.screen]();
  const navTab = NAV_SCREENS[S.screen];
  $screen.classList.toggle('has-nav', !!navTab);
  $screen.classList.toggle('noscroll', NOSCROLL.includes(S.screen));
  renderNav(navTab);
  if(transition){ $screen.classList.remove('fade-in'); void $screen.offsetWidth; $screen.classList.add('fade-in'); }
  $screen.scrollTop = keep;
  renderLayer();
  if(transition) onEnter();
}
function howSteps(){ return ['Scan a barcode or the front of the product','Read about the ingredients and company','See alternative options with your preferences'].map((t,i)=>`<p style="display:flex;gap:14px"><b style="font-family:var(--head);font-weight:300;font-size:22px">${i+1}</b><span>${t}</span></p>`).join(''); }
let lastTab=null;
function renderNav(tab){
  if(!tab){ $nav.innerHTML=''; lastTab=null; return; }
  let nav = $nav.querySelector('.nav');
  if(!nav){
    $nav.innerHTML = `<nav class="nav"><span class="blob"></span><button data-act="nav" data-v="browse">${I.bag}<span>browse</span></button><button data-act="nav" data-v="scan">${I.scan}<span>scan</span></button><button data-act="nav" data-v="profile">${I.user}<span>profile</span></button></nav>`;
    nav = $nav.querySelector('.nav');
  }
  const order=['browse','scan','profile'];
  let target=null;
  nav.querySelectorAll('button').forEach(b=>{
    const t=b.dataset.v, on=t===tab;
    b.classList.toggle('mirror', order.indexOf(t) > order.indexOf(tab));
    b.classList.toggle('on', on);
    if(on) target=b;
  });
  const blob = nav.querySelector('.blob');
  const L = target.offsetLeft, R = nav.clientWidth - (target.offsetLeft + target.offsetWidth);
  const ease = 'cubic-bezier(.65,0,.35,1)';
  if(!lastTab || lastTab===tab){ blob.style.transition='none'; }
  else {
    const right = order.indexOf(tab) > order.indexOf(lastTab);
    const dist = Math.abs(order.indexOf(tab)-order.indexOf(lastTab));
    const lead = .34 + .1*(dist-1), trail = .46 + .12*(dist-1), delay = .07;
    // the leading edge stretches out first, the trailing edge follows: the lime "flows" into the new tab
    blob.style.transition = right ? `right ${lead}s ${ease}, left ${trail}s ${ease} ${delay}s` : `left ${lead}s ${ease}, right ${trail}s ${ease} ${delay}s`;
  }
  blob.style.left = L+'px'; blob.style.right = R+'px';
  lastTab = tab;
}

/* squiggle fill animation */
function fillSquig(id, ms, done){
  const t0 = performance.now();
  const step = now => {
    const e = document.getElementById(id); if(!e) return;
    const im = e.firstElementChild; if(im && !im.style.width) im.style.width = e.parentNode.clientWidth+'px';
    const p = Math.min(1,(now-t0)/ms);
    const eased = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    e.style.width = (eased*100)+'%';
    if(p<1) raf = requestAnimationFrame(step); else done && done();
  };
  raf = requestAnimationFrame(step);
}
function dismissBar(){
  const el=document.querySelector('.pp > .feedback'); if(!el || S.screen!=='product') return;
  el.classList.add('leaving'); later(()=>{ if(S.screen==='product' && S.feedback!=='done' && S.feedback!=='no'){ S.feedback='done'; render(false);} },420);
}
function onEnter(){
  if(S.screen==='product' && S.feedback===null) later(()=>{ if(S.feedback===null) dismissBar(); },5000);
  if(S.screen==='scanner') runScan();
  if(S.screen==='calculating') fillSquig('calc', 1600, ()=>{ const l=document.getElementById('calcLbl'); if(l) l.textContent='complete!'; later(()=>finishAfterCalc(),500); });
}
function runScan(){
  fillSquig('squig', 2800, ()=>{
    const vf = document.getElementById('vf'); if(!vf) return;
    const sl = vf.querySelector('.scanline'); if(sl) sl.remove();
    vf.insertAdjacentHTML('beforeend', `<div class="detected">✓ ${S.scanMode==='barcode'?'Barcode 8 11920 09172 5':'Restorative Facial Serum'}</div>`);
    const l=document.getElementById('squigLbl'); if(l) l.textContent='complete!';
    if(S.rescan){
      const sc=document.getElementById('screen');
      const bc = S.scanMode==='barcode';
      sc.insertAdjacentHTML('beforeend', `<div class="feedback wrap scanprompt col" id="scanPrompt"><span>${bc?'This is the same barcode as the product you said was incorrect.':'This brings up the same product that you said was incorrect.'}</span><span class="pbtns"><button class="cta navy" data-act="seeAnyway">See anyway</button><button class="cta lime" data-act="switchScan">${bc?'Scan an image':'Scan barcode'}</button></span></div>`);
      return;
    }
    later(()=>openProduct('commons', true), 750);
  });
}

const act = {
  google(){ overlay('google'); },
  facebook(){ overlay('facebook'); },
  closeOverlay(){ overlay(null); },
  signedIn(){
    S.user='jesse';
    if(S.returnTo==='prefs'){ S.returnTo=null; go('choose'); }
    else if(S.returnTo==='profile'){ S.returnTo=null; overlay(null); render(false); toast('Signed in as Jesse'); }
    else if(S.screen==='profile'){ overlay(null); render(false); toast('Signed in as Jesse'); }
    else go('personalize');
  },
  guest(){ S.user='guest'; toScan(); },
  later(){ toScan(); },
  toChoose(){ go('choose'); },
  backGuest(){ if(S.prefsFromProfile){ S.prefsFromProfile=false; S.returnTo=null; go('profile'); return; } S.history.length ? go('product') : toScan(); },
  info(){ overlay('info'); },
  howSheet(){ overlay('info'); },
  mode(v){
    if(S.scanMode===v) return;
    S.scanMode=v;
    if(S.screen==='scanner'){ clearTimers(); render(false); runScan(); } else render(false);
  },
  startScan(){ S.seenHow=true; go('scanner'); },
  scanNew(){ toScan(); },
  scanBack(){ go('product'); },
  toProduct(){ go('product'); },
  productBack(){
    const f = S.from;
    if(f==='browse'||f==='profile') go(f);
    else if(f==='product'){ go('browse'); }
    else go('scanner');
  },
  openProduct(id){ openProduct(id, false); },
  chooseBack(){ S.history.length ? go('product') : (S.user==='jesse' && S.screen==='choose' && !S.seenHow ? go('personalize') : go('profile')); },
  nav(v){
    if(v==='scan'){ if(S.screen==='scanner') return; toScan(); return; }
    if(S.screen===v) return;
    if(!['browse','profile'].includes(S.screen)) S.navFrom = S.screen;
    go(v,{storeMenu:false});
  },
  navBack(){ go(S.navFrom && S.navFrom!=='how' ? S.navFrom : (S.history.length?'product':'scanner')); },
  storeMenu(){ S.storeMenu=!S.storeMenu; render(false); },
  setStore(v){ S.store = v==='All stores'?null:v; S.storeMenu=false; render(false); },
  editProfile(){ toast('Edit profile isn’t designed yet'); },
  signInProfile(){ S.returnTo='profile'; overlay('google'); },
  startQuiz(v, el){
    const start = () => go('quiz',{quizType:v, qi:0, answers: S.prefs[v]?{...S.prefs[v]}:{}, skipped:false, addingCustom:false, quizFrom:S.screen});
    if(el && el.classList.contains('tile')){ el.classList.add('picked'); later(start,180); return; }
    start();
  },
  editPrefs(v){ if(S.user!=='jesse'){ S.returnTo='prefs'; S.prefsFromProfile=true; go('signin'); return; } act.startQuiz(v); },
  answer(v){
    const q = QUIZ[S.quizType].qs[S.qi];
    if(q.multi){
      let a = S.answers[S.qi]||[];
      if(q.none && v===q.none) a = a.includes(v)?[]:[v];
      else { a = a.filter(x=>x!==q.none); a = a.includes(v)? a.filter(x=>x!==v) : [...a,v]; }
      S.answers[S.qi]=a; render(false);
    } else {
      S.answers[S.qi]=v; render(false);
      later(()=>act.qNext(), 300);
    }
  },
  addCustom(){ S.addingCustom=true; render(false); const i=document.getElementById('customIn'); i&&i.focus(); },
  noAllergy(){ const a=S.answers[S.qi]||[]; S.answers[S.qi]= a.includes('No known allergies')?[]:['No known allergies']; render(false); },
  rmAllergy(v){ S.answers[S.qi]=(S.answers[S.qi]||[]).filter(x=>x!==v); render(false); },
  qNext(){
    clearTimers();
    if(S.qi < QUIZ[S.quizType].qs.length-1){ S.qi++; S.addingCustom=false; render(true); }
    else { const ans={}; QUIZ[S.quizType].qs.forEach((_,i)=>ans[i]=S.answers[i]); S.prefs[S.quizType]=ans; go('calculating'); }
  },
  qSkip(){ S.skipped=true; act.qNext(); },
  qBack(){ clearTimers(); if(S.qi>0){ S.qi--; render(true);} else exitQuizTo(); },
  quizExit(){ overlay('exitQuiz'); },
  exitQuiz(){ exitQuizTo(); },
  finishOnly(){ go('ready'); },
  setPrefs(v){
    if(S.user!=='jesse'){ S.returnTo='prefs'; go('signin'); return; }
    if(v) act.startQuiz(v); else go('choose');
  },
  tab(v){ S.tab=v; S.yearMenu=false; render(false); },
  toggle(v){
    const wasOpen=S.open.has(v), closing=[...S.open];
    S.acc={opened: wasOpen?null:v, closed: closing};
    const before={}; document.querySelectorAll('[data-k]').forEach(el=>before[el.dataset.k]=el.getBoundingClientRect().height);
    S.open=new Set(wasOpen?[]:[v]); render(false); S.acc=null;
    document.querySelectorAll('[data-k]').forEach(el=>{
      const h0=before[el.dataset.k], h1=el.getBoundingClientRect().height;
      if(h0==null || Math.abs(h0-h1)<1) return;
      el.style.height=h0+'px'; el.style.overflow='hidden'; void el.offsetHeight;
      el.style.transition='height .42s cubic-bezier(.4,0,.2,1)'; el.style.height=h1+'px';
      const done=()=>{ el.style.height=''; el.style.overflow=''; el.style.transition=''; };
      el.addEventListener('transitionend',done,{once:true}); setTimeout(done,500);
    });
  },
  pol(){ S.polOpen=!S.polOpen; render(false); },
  research(v){ S.research=v; overlay('research'); },
  pickSwap(v){ S.topPick=v; S.justSwapped=true; render(false); const el=document.querySelector('.swap.swapped'); if(el){ const r=el.getBoundingClientRect(), sr=$screen.getBoundingClientRect(); if(r.top<sr.top+60) $screen.scrollBy({top:r.top-sr.top-120,behavior:'smooth'}); } },
  howCalc(v){ S.calcFor=v; overlay('howCalc'); },
  fbYes(){ S.feedback='yes'; render(false); later(()=>dismissBar(),1600); },
  fbNo(){ S.feedback='no'; render(false); later(()=>go('scanner',{rescan:true}),1600); },
  seeAnyway(){ S.rescan=false; openProduct('commons', true); S.feedback='done'; render(false); },
  switchScan(){ S.scanMode = S.scanMode==='barcode'?'image':'barcode'; S.rescan=false; clearTimers(); render(false); runScan(); },
  rescanAgain(){ const b=document.getElementById('scanPrompt'); if(b) b.remove(); clearTimers(); render(false); runScan(); },
  yearMenu(){ S.yearMenu=!S.yearMenu; render(false); },
  setYears(v){ S.years=+v; S.yearMenu=false; render(false); },
  donMore(){ S.donMore=!S.donMore; render(false); },
  moreOpts(){ S.moreOpts=true; render(false); },
  filter(){ overlay('filter'); },
  sort(v){ S.sort=v; render(false); overlay('filter'); },
  swapCurrent(){ $screen.scrollTo({top:0,behavior:'smooth'}); },
  save(){
    const on = S.saved.includes(S.pid);
    S.saved = on ? S.saved.filter(x=>x!==S.pid) : [S.pid, ...S.saved];
    render(false); toast(on?'Removed from saved':'Saved to your profile');
  },
  cat(v){ S.browseCat=v; render(false); },
  signOut(){ S.user='guest'; S.prefs={company:null,ingredient:null}; render(false); toast('Signed out'); },
};
function exitQuizTo(){
  const f = S.quizFrom;
  if(f==='product') go('product'); else if(f==='profile') go('profile'); else go('choose');
}
function finishAfterCalc(){
  if(S.quizFrom==='profile' || S.prefsFromProfile) { S.prefsFromProfile=false; go('profile'); toast('Preferences saved'); return; }
  if(S.prefs.company && S.prefs.ingredient) go('ready'); else go('choose');
}

    const v = document.getElementById('customIn').value.trim(); S.addingCustom=false;
    const q = QUIZ[S.quizType].qs[S.qi];
    if(v){ const k=q.custom; S.custom[k]=[...(S.custom[k]||[]).filter(x=>x!==v),v]; S.answers[S.qi]=[...(S.answers[S.qi]||[]).filter(x=>x!==q.none && x!==v),v]; }
    render(false);
  }
});
document.getElementById('restart').onclick = ()=>{ clearTimers(); S=fresh(); render(true); };
document.getElementById('jump').onclick = ()=>{ clearTimers(); S.user=S.user||'guest'; S.seenHow=true; openProduct('commons', true); };
window.addEventListener('resize',()=>{ const t=lastTab; if(t){ lastTab=null; renderNav(t); } });
render(true);
</script>
